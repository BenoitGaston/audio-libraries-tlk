[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-libraries-tlk"
version = "1.2.2"
authors = [
  { name="Benoît Gaston", email="benoitgaston59@gmail.com" },
]
description = "A package to extract and manipulate data contained in a music library such as playlists or album cover artwork."

readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "feedparser>=6.0.12",
    "ituneslibrary>=1.2.1",
    "music-tag>=0.4.3",
    "pandas>=2.0.3",
    "pillow>=10.4.0",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "requests>=2.32.4",
    "tqdm>=4.67.3",
]

[project.urls]
Homepage = "https://github.com/BenoitGaston/audio-libraries-tlk"
Issues = "https://github.com/BenoitGaston/audio-libraries-tlk/issues"

[tool.pytest.ini_options]
pythonpath = "src"

[tool.setuptools.packages.find]
where = ["./src/",]

[tool.setuptools.package-data]
"*" = ["*.*"]
