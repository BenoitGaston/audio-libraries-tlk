[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-libraries-tlk"
version = "1.2.3"
authors = [
  { name="Benoît Gaston", email="benoitgaston59@gmail.com" },
]
description = "A package to extract and manipulate data contained in a music library such as playlists or album cover artwork."

readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "feedparser>=6.0.14",
    "ituneslibrary>=1.2.1",
    "music-tag>=0.4.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pillow>=10.4.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35,<1.38",
]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
]

[project.scripts]
audio-libraries-tlk = "audio_libs_tlk.__main__:main"

[project.urls]
Homepage = "https://github.com/BenoitGaston/audio-libraries-tlk"
Issues = "https://github.com/BenoitGaston/audio-libraries-tlk/issues"

[tool.pytest.ini_options]
pythonpath = "src"

[tool.setuptools.packages.find]
where = ["./src/",]

[tool.setuptools.package-data]
"*" = ["*.*"]
